[project]
name = "actraforge"
version = "0.0.0"
description = "Reliable external actions for unreliable agents: runtime and test lab."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actraforge"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "hypothesis>=6.170.17",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
